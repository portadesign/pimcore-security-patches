name: verify

on:
  push:
    branches: [main, '[0-9]+.[0-9]+']
  pull_request:
    branches: [main, '[0-9]+.[0-9]+']
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: pimcore ${{ matrix.pimcore }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pimcore: [v10.6.9]
    steps:
      - uses: actions/checkout@v4
      - name: Verify patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./verify.sh "${{ matrix.pimcore }}"
